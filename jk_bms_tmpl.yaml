# Template voor 1 JK BMS. Niet aanpassen; wordt per BMS ingeladen vanuit het hoofdbestand.
# Variabelen: nr (0, 1, 2 ...) en address (0x00, 0x01 ...)

esphome:
  devices:
    - id: bms_device_${nr}
      name: bms${nr}

jk_rs485_bms:
  - id: bms${nr}
    rs485_address: ${address}
    jk_rs485_sniffer_id: sniffer0
    update_interval: 180s

sensor:
  - platform: jk_rs485_bms
    jk_rs485_bms_id: bms${nr}
    balancing_direction:
