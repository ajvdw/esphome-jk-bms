substitutions:
  rx_pin: GPIO2
  esp_name: bmswifi
  bms0_name: bms0
  bms1_name: bms1

esp32:
  variant: esp32c3
  framework:
    type: esp-idf
    advanced:
      flash_chip: generic

esphome:
  name: bmswifi
  friendly_name: BmsWifi
  project:
    name: "ajvdw.esphome-jk-bms"
    version: 1.0.0
  devices:
    - id: bms_device_0
      name: $bms0_name
      relation: child
    - id: bms_device_1
      name: $bms1_name
      relation: child

api:

logger:
  baud_rate: 0
  level: WARN

ota:
  platform: esphome

wifi:
  ap:
    password: jkbmspwd
  #ssid: !secret wifi_ssid
  #password: !secret wifi_password

captive_portal:


external_components:
  source: github://ajvdw/esphome-jk-bms@main
  refresh: 0s

uart:
  - id: uart_0
    rx_pin: $rx_pin
    rx_buffer_size: 384
    baud_rate: 115200

jk_rs485_monitor:
  - id: monitor0
    protocol_version: "JK02_32S"
    rx_timeout: 500ms
    uart_id: uart_0

jk_rs485_bms:
  - id: bms0
    device_id: bms_device_0
    rs485_address: 0x00
    jk_rs485_monitor_id: monitor0
    update_interval: 180s
  - id: bms1
    device_id: bms_device_1
    rs485_address: 0x01
    jk_rs485_monitor_id: monitor0
    update_interval: 180s

# One shared sensor definition, included once per BMS (fetched from the repo).
# To add a third BMS: add a jk_rs485_bms entry + device above and one more package here.
packages:
  bms0:
    url: https://github.com/ajvdw/esphome-jk-bms
    ref: main
    refresh: 0s   # always fetch the latest version
    files:
      - path: jk-bms-sensors.yaml
        vars:
          bms_id: bms0
  bms1:
    url: https://github.com/ajvdw/esphome-jk-bms
    ref: main
    refresh: 0s
    files:
      - path: jk-bms-sensors.yaml
        vars:
          bms_id: bms1

# Not per-BMS, so they stay here
sensor:
  - platform: uptime
    id: uptime_sec
  - platform: uptime
    name: ${esp_name} Uptime Sensor
    id: uptime_sensor
    update_interval: 5s
    entity_category: diagnostic
