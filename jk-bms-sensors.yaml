# Sensors for ONE JK-BMS, shared by all BMS units.
# Included once per BMS from the main file with a different bms_id.
# The device assignment comes from `device_id` on the jk_rs485_bms component,
# so only the component id is needed here.
#
# Variables:
#   bms_id   id of the jk_rs485_bms component (bms0, bms1, ...)

sensor:
  - platform: jk_rs485_bms
    jk_rs485_bms_id: ${bms_id}
    balancing_direction:
      name: "balancing direction"
    battery_capacity_setting:
      name: "battery capacity setting"
#    heating_current:
#      name: "heating current"
    cell_voltage_min:
      name: "cell voltage min"
